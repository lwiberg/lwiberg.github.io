<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warped wireframe prototype</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #181818;
    }

    .wireframe-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 0;
    }

    /* Put normal page content above the background without changing its layout. */
    .page-content {
      position: relative;
      z-index: 1;
    }
  </style>
  <script defer src="wireframe.js"></script>
</head>
<body>
  <canvas class="wireframe-background" aria-hidden="true"></canvas>
  <main class="page-content"></main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VHS Visualizer – Leila Wiberg</title>
  <link rel="icon" type="image/png" href="../../tinac_favicon.webp">
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .video-row.single-column {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      width: 100vw;
      max-width: 100vw;
      margin-left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      gap: 2vw;
      padding: 0 2vw;
    }

    .lofi-video-full {
      flex: 1 1 0;
      width: 48vw;
      max-width: 600px;
      min-width: 0;
      height: auto;
      margin-bottom: 0;
      display: block;
      object-fit: contain;
    }

    @media (max-width: 900px) {
      .video-row.single-column {
        flex-direction: column;
        gap: 2rem;
        padding: 0 1vw;
      }
      .lofi-video-full {
        width: 100vw;
        max-width: 100vw;
      }
    }
  </style>
</head>
<body>
  <div id="header-include"></div>

  <div class="video-row">
    <video src="render30001-0250.mp4" class="lofi-video" loop autoplay muted playsinline></video>
    <video src="render50001-0100.mp4" class="lofi-video" loop autoplay muted playsinline></video>
    <video src="render40001-0250.mp4" class="lofi-video" loop autoplay muted playsinline></video>
  </div>

  <div class="video-row single-column">
    <video src="experiment1.mp4" class="lofi-video-full" loop autoplay muted playsinline></video>
    <video src="experiment2.mp4" class="lofi-video-full" loop autoplay muted playsinline></video>
  </div>

  <div id="footer-include"></div>
  <script src="../../functions.js"></script>
</body>
</html>

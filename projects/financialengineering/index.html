<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financial Engineering – Leila Wiberg</title>
  <link rel="icon" type="image/png" href="../../tinac_favicon.png">
  <link rel="stylesheet" href="../../style.css" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3d59309f-911a-422c-8648-749505aab960"></script>
</head>
<body>
  <div id="header-include"></div>

  <div class="project-divider" style="margin-bottom: 1rem;">
    <hr>
    <span class="project-title">Financial Engineering Explainer</span>
    <div class="project-description">
      3D animation and motion design for complex financial concepts. 5+ minutes of animation in 2 weeks of work.
    </div>
  </div>

  <main class="nine-item-main">
    <div class="video-container" style="margin-top: 0.5rem;">
      <div class="custom-video-wrapper">
        <video id="financialEngineeringVideo" poster="thumbnail-1.jpg" controls muted>
          <source src="financialengineeringhighlights.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>

    <div class="nine-item-grid nine-item-grid--two-col">
      <img src="thumbnail-1.jpg" alt="Financial Engineering title card">
      <img src="thumbnail-2.jpg" alt="How mortgages work chart">
      <img src="thumbnail-3.jpg" alt="Debt, credit, and security icons around a character">
      <img src="thumbnail-4.jpg" alt="Presidio logo with oil pumpjacks">
    </div>

    <div class="captioned-image-row">
      <figure class="captioned-image">
        <img src="icons.png" alt="Financial engineering icon set">
        <figcaption>A library of 3D icons created in Blender.</figcaption>
      </figure>
      <figure class="captioned-image">
        <img src="inspo.png" alt="Financial engineering inspiration moodboard">
        <figcaption>Reference and inspiration.</figcaption>
      </figure>
    </div>
  </main>

  <div id="footer-include"></div>
  <script src="../../functions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Environments – Leila Wiberg</title>
  <link rel="icon" type="image/png" href="../../tinac_favicon.png">
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="header-include"></div>

  <div class="five-item-collage">
    <img src="dark.png" class="collage-landscape" style="grid-row: 1; grid-column: 1;">
    <img src="isolatedshot.png" class="collage-landscape" style="grid-row: 1; grid-column: 3;">
    <img src="profilepic.png" class="collage-landscape" style="grid-row: 2; grid-column: 1;">
    <img src="0001.png" class="collage-landscape" style="grid-row: 2; grid-column: 3;">
    <img src="okgoodenough.png" alt="Portrait" class="collage-portrait">
  </div>

  <div class="five-item-collage">
    <img src="zoomoutrendercenterednodenoise.png" class="collage-landscape" style="grid-row: 1; grid-column: 1;">
    <img src="theone.png" class="collage-landscape" style="grid-row: 1; grid-column: 3;">
    <img src="WIPWITHFOG.png" class="collage-landscape" style="grid-row: 2; grid-column: 1;">
    <img src="horizontalrender.png" class="collage-landscape" style="grid-row: 2; grid-column: 3;">
    <img src="done_high_res.png" alt="Portrait" class="collage-portrait">
  </div>

  <div id="footer-include"></div>
  <script src="../../functions.js"></script>
</body>
</html>

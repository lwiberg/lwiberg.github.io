<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space Renders – Leila Wiberg</title>
  <link rel="icon" type="image/png" href="../../tinac_favicon.png">
  <link rel="stylesheet" href="../../style.css" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3d59309f-911a-422c-8648-749505aab960"></script>
</head>
<body>
  <div id="header-include"></div>

  <main class="nine-item-main">
    <div class="nine-item-grid">
      <img src="earth-from-the-moon-catalogue-render.webp" alt="">
      <img src="mars-earth-stars-render.webp" alt="">
      <img src="mars-render-cosmo-thickeratmo.webp" alt="">
      <img src="solar-system-test-render.webp" alt="">
      <img src="solar-system-test-render-4.webp" alt="">
      <video src="/projects/spacerenders/leila_space_sample_1.mp4" poster="/projects/spacerenders/space-thumbnail-1_1.1.1.webp" preload="none" autoplay loop muted playsinline></video>
    </div>  
  </main>

  <section class="image-carousel" aria-label="Transastra 3D renders">
    <div class="image-carousel-viewport">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D.jpg" alt="Transastra 3D render 1">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (1).jpg" alt="Transastra 3D render 2">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (2).jpg" alt="Transastra 3D render 3">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (3).jpg" alt="Transastra 3D render 4">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (4).jpg" alt="Transastra 3D render 5">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (5).jpg" alt="Transastra 3D render 6">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (6).jpg" alt="Transastra 3D render 7">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (7).jpg" alt="Transastra 3D render 8">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (8).jpg" alt="Transastra 3D render 9">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (9).jpg" alt="Transastra 3D render 10">
      <img class="image-carousel-slide" src="/projects/spacerenders/Transastra 3D (10).jpg" alt="Transastra 3D render 11">
      <button class="image-carousel-arrow left" aria-label="Previous image">&#8592;</button>
      <button class="image-carousel-arrow right" aria-label="Next image">&#8594;</button>
      <span class="image-carousel-counter"></span>
    </div>
    <div class="image-carousel-dots">
      <button class="image-carousel-dot" aria-label="Go to image 1"></button>
      <button class="image-carousel-dot" aria-label="Go to image 2"></button>
      <button class="image-carousel-dot" aria-label="Go to image 3"></button>
      <button class="image-carousel-dot" aria-label="Go to image 4"></button>
      <button class="image-carousel-dot" aria-label="Go to image 5"></button>
      <button class="image-carousel-dot" aria-label="Go to image 6"></button>
      <button class="image-carousel-dot" aria-label="Go to image 7"></button>
      <button class="image-carousel-dot" aria-label="Go to image 8"></button>
      <button class="image-carousel-dot" aria-label="Go to image 9"></button>
      <button class="image-carousel-dot" aria-label="Go to image 10"></button>
      <button class="image-carousel-dot" aria-label="Go to image 11"></button>
    </div>
  </section>

  <div id="footer-include"></div>
  <script src="../../functions.js"></script>
</body>
</html>

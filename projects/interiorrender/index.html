<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interior Render Collage – Leila Wiberg</title>
  <link rel="icon" type="image/png" href="../../tinac_favicon.png">
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="header-include"></div>

  <div class="five-item-collage">
    <img src="bamboowide.png" class="collage-landscape" style="grid-row: 1; grid-column: 1;">
    <img src="ROOM_RENDER.png" class="collage-landscape" style="grid-row: 1; grid-column: 3;">
    <img src="ROOM_RENDER_bedpov.png" class="collage-landscape" style="grid-row: 2; grid-column: 1;">
    <img src="ROOM_RENDER_Night.png" class="collage-landscape" style="grid-row: 2; grid-column: 3;">
    <img src="black.png" alt="Portrait" class="collage-portrait">
  </div>

  <div id="footer-include"></div>
  <script src="../../functions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DJ Logos Project – Leila Wiberg</title>
  <link rel="icon" type="image/png" href="/tinac_favicon.webp">
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="header-include"></div>

  <div class="djlogoloops-main">
    <div class="djlogoloops-stack" style="background-image: url('blackgradient.webp');">
      <img src="doco_white.webp" alt="Doco White Logo" class="djlogoloops-logo">
      <video class="djlogoloops-video" src="doco4.mp4" autoplay loop muted playsinline></video>
    </div>
  </div>

  <div class="djlogoloops-main">
    <div class="djlogoloops-stack" style="background-image: url('blackgradient.webp');">
      <img src="redtrocropped.webp" alt="Redtro Logo" class="djlogoloops-logo">
      <video class="djlogoloops-video" src="redtro4.mp4" autoplay loop muted playsinline></video>
    </div>
  </div>

  <div class="djlogoloops-main">
    <div class="djlogoloops-stack" style="background-image: url('blackgradient.webp');">
      <img src="tywhitebubble.webp" alt="Ty White Bubble Logo" class="djlogoloops-logo">
      <video class="djlogoloops-video" src="ty4.mp4" autoplay loop muted playsinline></video>
    </div>
  </div>

  <div id="footer-include"></div>
  <script src="../../functions.js"></script>
</body>
</html>

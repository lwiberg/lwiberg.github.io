<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marine Railway – Leila Wiberg</title>
  <link rel="icon" type="image/webp" href="../../tinac_favicon.webp">
  <link rel="stylesheet" href="../../style.css" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3d59309f-911a-422c-8648-749505aab960"></script>
</head>
<body>
  <div id="header-include"></div>

  <div class="project-divider">
    <hr>
    <span class="project-title">Marine Railway</span>
    <div class="project-description">
      3D modeling and visualization of a marine railway cable haul-out system, built from engineering diagrams and on-site reference photos.
    </div>
  </div>

  <main class="nine-item-main">
          <figure class="captioned-image" style="margin-bottom: 3rem;">
            <img src="/projects/marinerailway/beforeandafterdiagrams.png" alt="Before and after: original engineering diagrams next to the final 3D visualization">
            <figcaption>Original engineering diagrams (left) used as reference to build the final 3D visualization (right).</figcaption>
          </figure>

          <div class="nine-item-grid">
            <img src="/projects/marinerailway/big-chute-model-wireframe-wip.webp" alt="">
            <img src="/projects/marinerailway/haulingframe-inprogress-wireframe.webp" alt="">
            <img src="/projects/marinerailway/tracks-inprogress-wireframe.webp" alt="">
            <img src="/projects/marinerailway/big-chute-model-wip.webp" alt="">
            <img src="/projects/marinerailway/haulingframe-inprogress-clay.webp" alt="">
            <img src="/projects/marinerailway/tracks-inprogress-clay.webp" alt="">
            <video src="/projects/marinerailway/bigchute_gfx_v0_with_grid.mp4" poster="/projects/marinerailway/railway-thumbnail-1_1.1.1.webp" preload="none" autoplay loop muted playsinline></video>
            <video src="/projects/marinerailway/shot1.mp4" poster="/projects/marinerailway/railway-thumbnail-2_1.2.1.webp" preload="none" autoplay loop muted playsinline></video>
            <video src="/projects/marinerailway/shot2.mp4" poster="/projects/marinerailway/railway-thumbnail-3_1.3.1.webp" preload="none" autoplay loop muted playsinline></video>
          </div> 

          <figure class="captioned-image">
            <img src="/projects/marinerailway/marinerailwayreferences.png" alt="Marine railway reference collage">
            <figcaption>No large scale reference was available that visualized the entire railway cable system, so I pieced together the puzzle with diagrams and photos taken on site.</figcaption>
          </figure>
    </main>

  <div id="footer-include"></div>
  <script src="../../functions.js"></script>
</body>
</html>

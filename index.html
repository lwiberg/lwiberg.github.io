<script>
const projectLinks = [
  { 
    path: "projects/historyytchannel/index.html", 
    title: "History YouTube Channel",
    description: "Responsible for everything, from creative direction to editing. 3D made in Blender and 2D made in After Effects. Some models sourced online."
  },
  { 
    path: "projects/financialyt/index.html", 
    title: "Financial YouTube Channel",
    description: "Responsible for everything, from creative direction to editing. Made in Blender and Da Vinci Resolve. Some models sourced online."
  },
  { 
    path: "projects/engineering-yt-channel/index.html", 
    title: "Engineering YouTube Video",
    description: "Given a storyboard and oil rig model, I created an animation in Blender to match the voiceover. "
  },
  { 
    path: "projects/shippingcompany/index.html", 
    title: "Shipping Company 3D Rebrand",
    description: "Creative direction for a shipping technology company rebrand. 3D models provided by the client, animated and rendered in Blender."
  },
  { 
    path: "projects/marinerailway/index.html", 
    title: "Marine Railway Model",
    description: "From reference images, I modeled a detailed marine railway in Blender, and animated to a voiceover for a Youtube video."
  },
  { 
    path: "projects/spacerenders/index.html", 
    title: "Solar System Renders",
    description: "Used Blender to make high quality renders of the solar system for a promotional video."
  },
  { 
    path: "projects/truecrimeytchannel/index.html", 
    title: "True Crime YouTube Channel",
    description: "Built 3D scenes and animated to a voiceover for a True Crime Youtube channel.  Made in Blender."
  },
  { 
    path: "projects/visualeffects/index.html", 
    title: "VFX for Short Film",
    description: "My most ambitious VFX project. Creating VFX overlays with simulated 3D elements in Blender and lots of compositing in After Effects."
  },
  { 
    path: "projects/webdesign/index.html", 
    title: "Website Design",
    description: "Bet you didn't know I can do 2D animation in a 3D program! Made in Blender with some geometry nodes tricks for infinite looping."
  }
  // Add more projects as needed
];

const container = document.getElementById("all-projects");

async function loadProjectsSequentially() {
  for (const { path, title, description } of projectLinks) {
    try {
      const res = await fetch(path);
      const html = await res.text();
      const folder = path.substring(0, path.lastIndexOf('/') + 1);
      const bodyContent = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = bodyContent ? bodyContent[1] : html;

      // Fix relative paths for src, href, and poster attributes
      tempDiv.querySelectorAll('[src]').forEach(el => {
        const src = el.getAttribute('src');
        if (src && !src.startsWith('/') && !src.startsWith('http')) {
          el.setAttribute('src', folder + src);
        }
      });
      tempDiv.querySelectorAll('[href]').forEach(el => {
        const href = el.getAttribute('href');
        if (href && !href.startsWith('/') && !href.startsWith('http') && !href.startsWith('#')) {
          el.setAttribute('href', folder + href);
        }
      });
      tempDiv.querySelectorAll('[poster]').forEach(el => {
        const poster = el.getAttribute('poster');
        if (poster && !poster.startsWith('/') && !poster.startsWith('http')) {
          el.setAttribute('poster', folder + poster);
        }
      });

      // Create divider with editable title and description
      const divider = document.createElement("div");
      divider.className = "project-divider";
      divider.innerHTML = `
        <hr>
        <span class="project-title" contenteditable="true">${title}</span>
        <div class="project-description" contenteditable="true">${description}</div>
      `;

      container.appendChild(divider);

      const section = document.createElement("section");
      section.innerHTML = tempDiv.innerHTML;
      container.appendChild(section);
    } catch (e) {
      console.error(`Failed to load ${title}:`, e);
    }
  }
}

document.addEventListener("DOMContentLoaded", loadProjectsSequentially);
</script>
